<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zuba International | Our Products</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(192,161,107,0.08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 60%,
                    rgba(0,90,180,0.12),
                    transparent 35%
                ),
                #050f1a;
            color: #ffffff;
            overflow-x: hidden;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: rgba(5,15,26,0.92);

            padding: 18px 30px;

            border-bottom:
                1px solid rgba(192,161,107,0.6);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 10px 40px rgba(0,0,0,0.25);
        }

        .nav-container {
            max-width: 1200px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: #ffffff;
            text-decoration: none;

            font-size: 22px;
            font-weight: 700;

            letter-spacing: 1px;

            transition: 0.3s ease;
        }

        .logo span {
            color: #c0a16b;
        }

        .logo:hover {
            transform: translateY(-2px);
            text-shadow:
                0 0 15px rgba(192,161,107,0.6);
        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 28px;

            list-style: none;
        }

        .nav-menu a {
            position: relative;

            color: #ffffff;
            text-decoration: none;

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 1px;

            display: flex;
            align-items: center;
            gap: 8px;

            transition:
                color 0.35s ease,
                transform 0.35s ease;
        }

        .nav-menu a i {
            color: #c0a16b;

            transition:
                transform 0.35s ease;
        }

        .nav-menu a::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: -8px;

            width: 0;
            height: 2px;

            background: #c0a16b;

            transition: width 0.35s ease;
        }

        .nav-menu a:hover {
            color: #c0a16b;
            transform: translateY(-3px);
        }

        .nav-menu a:hover i {
            transform: rotateY(180deg);
        }

        .nav-menu a:hover::after {
            width: 100%;
        }


        /* =====================================================
           MOBILE MENU BUTTON
        ===================================================== */

        #menu-toggle {
            display: none;

            color: #c0a16b;
            font-size: 25px;

            cursor: pointer;

            transition: 0.3s;
        }

        #menu-toggle:hover {
            transform: scale(1.15);
        }


        /* =====================================================
           PAGE BANNER
        ===================================================== */

        .page-banner {
            position: relative;

            padding: 90px 20px 80px;

            text-align: center;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    rgba(5,15,26,0.95),
                    rgba(7,22,40,0.9)
                );

            border-bottom:
                1px solid rgba(192,161,107,0.2);
        }

        .page-banner::before {
            content: "";

            position: absolute;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background:
                rgba(192,161,107,0.08);

            filter: blur(60px);

            top: -150px;
            left: -100px;

            animation:
                bannerGlow 6s ease-in-out infinite alternate;
        }

        .page-banner::after {
            content: "";

            position: absolute;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background:
                rgba(0,100,220,0.08);

            filter: blur(60px);

            right: -100px;
            bottom: -150px;

            animation:
                bannerGlow 7s ease-in-out infinite alternate-reverse;
        }

        @keyframes bannerGlow {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(35px);
            }
        }

        .page-banner h1 {
            position: relative;
            z-index: 2;

            font-family: 'Playfair Display', serif;

            font-size:
                clamp(32px,5vw,52px);

            color: #c0a16b;

            margin-bottom: 15px;

            text-shadow:
                0 0 25px rgba(192,161,107,0.25);

            animation:
                titleFloat 4s ease-in-out infinite;
        }

        @keyframes titleFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        .page-banner p {
            position: relative;
            z-index: 2;

            color: #94a3b8;

            font-size: 14px;

            letter-spacing: 2px;

            line-height: 1.7;
        }


        /* =====================================================
           PRODUCTS SECTION
        ===================================================== */

        .products-section {
            max-width: 1250px;

            margin: 70px auto;

            padding: 0 20px;
        }

        .products-intro {
            text-align: center;

            max-width: 800px;

            margin:
                0 auto 45px;
        }

        .products-intro h2 {
            font-family:
                'Playfair Display',
                serif;

            font-size: 30px;

            color: #ffffff;

            margin-bottom: 12px;
        }

        .products-intro h2 span {
            color: #c0a16b;
        }

        .products-intro p {
            color: #94a3b8;

            font-size: 14px;

            line-height: 1.8;
        }


        /* =====================================================
           PRODUCT GRID
        ===================================================== */

        .products-grid {

            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            gap: 32px;
        }


        /* =====================================================
           PRODUCT CARD
        ===================================================== */

        .product-card {

            position: relative;

            min-height: 480px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.07),
                    rgba(255,255,255,0.015)
                );

            border:
                1px solid rgba(192,161,107,0.25);

            border-radius: 18px;

            overflow: hidden;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            transform-style: preserve-3d;

            transition:
                transform 0.45s ease,
                box-shadow 0.45s ease,
                border-color 0.45s ease;

            animation:
                cardFloat 6s ease-in-out infinite;
        }


        /* Different floating timing */

        .product-card:nth-child(2) {
            animation-delay: -1s;
        }

        .product-card:nth-child(3) {
            animation-delay: -2s;
        }

        .product-card:nth-child(4) {
            animation-delay: -3s;
        }

        .product-card:nth-child(5) {
            animation-delay: -4s;
        }

        .product-card:nth-child(6) {
            animation-delay: -5s;
        }

        .product-card:nth-child(7) {
            animation-delay: -2.5s;
        }

        .product-card:nth-child(8) {
            animation-delay: -1.5s;
        }

        .product-card:nth-child(9) {
            animation-delay: -3.5s;
        }

        .product-card:nth-child(10) {
            animation-delay: -4.5s;
        }

        .product-card:nth-child(11) {
            animation-delay: -2s;
        }

        .product-card:nth-child(12) {
            animation-delay: -5.5s;
        }


        @keyframes cardFloat {

            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-7px);
            }
        }


        /* =====================================================
           CARD GLOW
        ===================================================== */

        .product-card::before {

            content: "";

            position: absolute;

            inset: 0;

            border-radius: 18px;

            background:
                linear-gradient(
                    120deg,
                    transparent 20%,
                    rgba(192,161,107,0.15),
                    transparent 80%
                );

            opacity: 0;

            transition:
                opacity 0.4s ease;

            pointer-events: none;

            z-index: 3;
        }

        .product-card:hover::before {
            opacity: 1;
        }

        .product-card:hover {

            animation-play-state: paused;

            border-color:
                rgba(192,161,107,0.85);

            box-shadow:
                0 25px 60px rgba(0,0,0,0.55),
                0 0 35px rgba(192,161,107,0.14);

            transform:
                translateY(-15px)
                scale(1.025);
        }


        /* =====================================================
           PRODUCT IMAGE / ICON AREA
        ===================================================== */

        .product-img {

            position: relative;

            width: 100%;
            height: 220px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(0,110,255,0.55),
                    rgba(7,25,48,0.96) 68%
                );

            border-bottom:
                1px solid rgba(192,161,107,0.2);

            overflow: hidden;
        }


        /* Decorative circles */

        .product-img::after {

            content: "";

            position: absolute;

            width: 140px;
            height: 140px;

            border:
                1px solid
                rgba(255,255,255,0.12);

            border-radius: 50%;

            box-shadow:
                0 0 50px
                rgba(0,150,255,0.15);

            animation:
                imagePulse 4s ease-in-out infinite;
        }

        @keyframes imagePulse {

            0%,
            100% {
                transform:
                    scale(0.9);
                opacity: 0.5;
            }

            50% {
                transform:
                    scale(1.12);
                opacity: 1;
            }
        }


        /* Light sweep */

        .product-img::before {

            content: "";

            position: absolute;

            width: 130%;
            height: 55px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.14),
                    transparent
                );

            transform:
                rotate(-35deg)
                translateX(-100%);

            animation:
                shine 5s linear infinite;
        }

        @keyframes shine {

            0% {
                transform:
                    rotate(-35deg)
                    translateX(-100%);
            }

            40%,
            100% {
                transform:
                    rotate(-35deg)
                    translateX(100%);
            }
        }


        /* Product Icon */

        .product-img i {

            position: relative;

            z-index: 5;

            font-size: 60px;

            color: #ffffff;

            text-shadow:
                0 0 15px rgba(255,255,255,0.45),
                0 0 35px rgba(192,161,107,0.45);

            transition:
                transform 0.5s ease,
                color 0.5s ease;
        }

        .product-card:hover
        .product-img i {

            color: #c0a16b;

            transform:
                scale(1.18)
                rotateY(12deg);

            text-shadow:
                0 0 20px
                rgba(192,161,107,0.8),

                0 0 45px
                rgba(192,161,107,0.45);
        }


        /* =====================================================
           PRODUCT INFO
        ===================================================== */

        .product-info {

            position: relative;

            padding: 25px;

            min-height: 260px;

            display: flex;

            flex-direction: column;
        }

        .product-category {

            display: inline-block;

            width: fit-content;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 1.5px;

            color: #c0a16b;

            margin-bottom: 10px;

            text-transform: uppercase;
        }

        .product-info h3 {

            font-family:
                'Playfair Display',
                serif;

            font-size: 21px;

            color: #ffffff;

            margin-bottom: 12px;

            transition:
                color 0.3s ease,
                transform 0.3s ease;
        }

        .product-card:hover
        .product-info h3 {

            color: #c0a16b;

            transform:
                translateX(4px);
        }

        .product-info p {

            font-size: 13px;

            color: #cbd5e1;

            line-height: 1.75;

            margin-bottom: 20px;
        }


        /* =====================================================
           WHATSAPP INQUIRE BUTTON
        ===================================================== */

        .inquire-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            width: fit-content;

            margin-top: auto;

            background:
                rgba(192,161,107,0.04);

            border:
                1px solid #c0a16b;

            color: #c0a16b;

            padding: 11px 18px;

            font-weight: 600;

            font-size: 11px;

            text-decoration: none;

            border-radius: 6px;

            letter-spacing: 0.8px;

            transition:
                all 0.35s ease;
        }

        .inquire-btn i {
            font-size: 15px;
        }

        .inquire-btn:hover {

            background: #c0a16b;

            color: #050f1a;

            transform:
                translateY(-4px)
                scale(1.04);

            box-shadow:
                0 12px 25px
                rgba(192,161,107,0.25);
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            background: #030a12;

            border-top:
                1px solid
                rgba(192,161,107,0.2);

            padding: 55px 20px;

            text-align: center;

            margin-top: 90px;
        }

        .footer-content {

            max-width: 900px;

            margin: auto;

            line-height: 1.8;
        }

        .copyright {

            color: #ffffff;

            font-weight: 600;

            margin-bottom: 15px;

            font-size: 14px;

            letter-spacing: 0.5px;
        }

        .company-details {

            color: #c0a16b;

            font-size: 12px;

            letter-spacing: 1px;

            line-height: 2;
        }


        /* =====================================================
           FLOATING WHATSAPP
        ===================================================== */

        .whatsapp-float {

            position: fixed;

            bottom: 25px;
            right: 25px;

            width: 62px;
            height: 62px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #25d366;

            color: #ffffff;

            border-radius: 50%;

            font-size: 30px;

            text-decoration: none;

            z-index: 2000;

            box-shadow:
                0 5px 25px
                rgba(37,211,102,0.35);

            animation:
                whatsappFloat
                2.5s ease-in-out infinite;

            transition:
                0.3s ease;
        }

        @keyframes whatsappFloat {

            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-10px);
            }
        }

        .whatsapp-float:hover {

            animation-play-state: paused;

            transform:
                scale(1.12)
                rotate(8deg);

            box-shadow:
                0 8px 35px
                rgba(37,211,102,0.55);
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 1000px) {

            .products-grid {
                grid-template-columns:
                    repeat(2,1fr);
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 768px) {

            header {
                padding: 16px 20px;
            }

            #menu-toggle {
                display: block;
            }

            .nav-menu {

                display: none;

                position: absolute;

                top: 68px;
                left: 0;

                width: 100%;

                flex-direction: column;

                gap: 22px;

                padding: 2
