l<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Zuba International</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: #fdfbf7; }
        
        header { background: #0a2540; padding: 20px; color: white; border-bottom: 3px solid #c0a16b; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .nav-menu { display: flex; gap: 15px; list-style: none; padding: 0; }
        .nav-menu a { color: white; text-decoration: none; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; }

        .products-container { max-width: 1000px; margin: 20px auto; padding: 10px; }
        
        /* Grid Fix: Mobile par 1 column, laptop par 4 */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; 
            margin-top: 20px;
        }
        
        .card { 
            background: white; padding: 20px; border: 1px solid #ddd; 
            text-align: center; border-radius: 8px; 
        }
        .card i { font-size: 30px; color: #c0a16b; margin-bottom: 10px; }
        .card h3 { font-size: 14px; margin: 10px 0; }
        .btn-quote { display: block; margin-top: 10px; padding: 8px; background: #0a2540; color: white; text-decoration: none; font-size: 11px; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" style="color:white; font-weight:bold; text-decoration:none;">ZUBA INTERNATIONAL</a>
            <nav class="nav-menu">
                <a href="index.html"><i class="fa-solid fa-house"></i> HOME</a>
                <a href="products.html"><i class="fa-solid fa-box-open"></i> PROD</a>
            </nav>
        </div>
    </header>

    <div class="products-container">
        <h2 style="text-align:center;">Global Import Catalog</h2>
        <div class="grid">
            <div class="card"><i class="fa-solid fa-layer-group"></i><h3>Fluted Panels</h3><a href="#" class="btn-quote">GET QUOTE</a></div>
            <div class="card"><i class="fa-solid fa-square-full"></i><h3>WPC Panels</h3><a href="#" class="btn-quote">GET QUOTE</a></div>
            <div class="card"><i class="fa-solid fa-gem"></i><h3>UV Marble</h3><a href="#" class="btn-quote">GET QUOTE</a></div>
            <div class="card"><i class="fa-solid fa-mountain"></i><h3>PU Stone</h3><a href="#" class="btn-quote">GET QUOTE</a></div>
        </div>
    </div>
</body>
</html>
