<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zuba International | Our Products</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        /* ==============================
           BASIC RESET
        ============================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(192,161,107,0.08), transparent 30%),
                radial-gradient(circle at 80% 60%, rgba(0,90,180,0.12), transparent 35%),
                #050f1a;
            color: #ffffff;
            overflow-x: hidden;
        }


        /* ==============================
           HEADER
        ============================== */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: rgba(5, 15, 26, 0.88);

            padding: 18px 30px;

            border-bottom: 1px solid rgba(192,161,107,0.6);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 10px 40px rgba(0,0,0,0.25);
        }

        .nav-container {
            max-width: 1200px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: #ffffff;
            text-decoration: none;

            font-size: 22px;
            font-weight: 700;

            letter-spacing: 1px;

            transition: 0.3s ease;
        }

        .logo span {
            color: #c0a16b;
        }

        .logo:hover {
            transform: translateY(-2px);
            text-shadow:
                0 0 15px rgba(192,161,107,0.6);
        }


        /* ==============================
           NAVIGATION
        ============================== */

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 28px;

            list-style: none;
        }

        .nav-menu a {
            position: relative;

            color: #ffffff;
            text-decoration: none;

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 1px;

            display: flex;
            align-items: center;
            gap: 8px;

            transition: all 0.35s ease;
        }

        .nav-menu a i {
            color: #c0a16b;
            transition: 0.35s ease;
        }

        .nav-menu a::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: -8px;

            width: 0;
            height: 2px;

            background: #c0a16b;

            transition: width 0.35s ease;
        }

        .nav-menu a:hover {
            color: #c0a16b;
            transform: translateY(-3px);
        }

        .nav-menu a:hover i {
            transform: rotateY(180deg);
        }

        .nav-menu a:hover::after {
            width: 100%;
        }


        /* ==============================
           MOBILE MENU
        ============================== */

        #menu-toggle {
            display: none;

            color: #c0a16b;
            font-size: 25px;

            cursor: pointer;

            transition: 0.3s;
        }

        #menu-toggle:hover {
            transform: scale(1.15);
        }


        /* ==============================
           PAGE BANNER
        ============================== */

        .page-banner {
            position: relative;

            padding: 90px 20px 80px;

            text-align: center;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    rgba(5,15,26,0.95),
                    rgba(7,22,40,0.9)
                );

            border-bottom: 1px solid rgba(192,161,107,0.2);
        }

        /* Decorative glow */

        .page-banner::before {
            content: "";

            position: absolute;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background: rgba(192,161,107,0.08);

            filter: blur(60px);

            top: -150px;
            left: -100px;

            animation: bannerGlow 6s ease-in-out infinite alternate;
        }

        .page-banner::after {
            content: "";

            position: absolute;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background: rgba(0,100,220,0.08);

            filter: blur(60px);

            right: -100px;
            bottom: -150px;

            animation: bannerGlow 7s ease-in-out infinite alternate-reverse;
        }

        @keyframes bannerGlow {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(35px);
            }
        }

        .page-banner h1 {
            position: relative;
            z-index: 2;

            font-family: 'Playfair Display', serif;

            font-size: clamp(32px, 5vw, 52px);

            color: #c0a16b;

            margin-bottom: 15px;

            text-shadow:
                0 0 25px rgba(192,161,107,0.25);

            animation: titleFloat 4s ease-in-out infinite;
        }

        @keyframes titleFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        .page-banner p {
            position: relative;
            z-index: 2;

            color: #94a3b8;

            font-size: 14px;

            letter-spacing: 2px;

            line-height: 1.7;
        }


        /* ==============================
           PRODUCTS SECTION
        ============================== */

        .products-section {
            max-width: 1200px;

            margin: 70px auto;

            padding: 0 20px;
        }

        .products-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 35px;
        }


        /* ==============================
           PRODUCT CARD
        ============================== */

        .product-card {

            position: relative;

            min-height: 470px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.07),
                    rgba(255,255,255,0.015)
                );

            border: 1px solid rgba(192,161,107,0.25);

            border-radius: 18px;

            overflow: hidden;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            transform-style: preserve-3d;

            perspective: 1000px;

            transition:
                transform 0.25s ease,
                box-shadow 0.4s ease,
                border-color 0.4s ease;

            animation: cardFloat 5s ease-in-out infinite;
        }

        /* Different timing for cards */

        .product-card:nth-child(2) {
            animation-delay: -1s;
        }

        .product-card:nth-child(3) {
            animation-delay: -2s;
        }

        .product-card:nth-child(4) {
            animation-delay: -3s;
        }

        .product-card:nth-child(5) {
            animation-delay: -4s;
        }

        .product-card:nth-child(6) {
            animation-delay: -2.5s;
        }


        @keyframes cardFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }


        /* Gold glowing border */

        .product-card::before {

            content: "";

            position: absolute;

            inset: -2px;

            border-radius: 18px;

            background:
                linear-gradient(
                    120deg,
                    transparent,
                    rgba(192,161,107,0.35),
                    transparent
                );

            opacity: 0;

            transition: opacity 0.4s ease;

            pointer-events: none;
        }

        .product-card:hover::before {
            opacity: 1;
        }

        .product-card:hover {

            animation-play-state: paused;

            border-color: rgba(192,161,107,0.8);

            box-shadow:
                0 25px 60px rgba(0,0,0,0.55),
                0 0 35px rgba(192,161,107,0.12);

            transform:
                translateY(-15px)
                scale(1.02);
        }


        /* ==============================
           PRODUCT IMAGE AREA
        ============================== */

        .product-img {

            position: relative;

            width: 100%;
            height: 220px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(0,110,255,0.5),
                    rgba(7,25,48,0.95) 65%
                );

            border-bottom:
                1px solid rgba(192,161,107,0.2);

            overflow: hidden;

            transform: translateZ(25px);
        }


        /* Light sweep */

        .product-img::before {

            content: "";

            position: absolute;

            width: 120%;
            height: 50px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.12),
                    transparent
                );

            transform:
                rotate(-35deg)
                translateX(-100%);

            animation: shine 5s linear infinite;
        }

        @keyframes shine {

            0% {
                transform:
                    rotate(-35deg)
                    translateX(-100%);
            }

            40%,
            100% {
                transform:
                    rotate(-35deg)
                    translateX(100%);
            }
        }


        /* Product icon */

        .product-img i {

            position: relative;
            z-index: 2;

            font-size: 58px;

            color: #ffffff;

            text-shadow:
                0 0 15px rgba(255,255,255,0.4),
                0 0 35px rgba(192,161,107,0.4);

            transition:
                transform 0.5s ease,
                color 0.5s ease;
        }

        .product-card:hover .product-img i {

            color: #c0a16b;

            transform:
                translateZ(35px)
                scale(1.18)
                rotateY(10deg);

            text-shadow:
                0 0 20px rgba(192,161,107,0.7),
                0 0 45px rgba(192,161,107,0.4);
        }


        /* ==============================
           PRODUCT INFO
        ============================== */

        .product-info {

            position: relative;

            padding: 25px;

            min-height: 250px;

            display: flex;

            flex-direction: column;

            transform-style: preserve-3d;
        }

        .product-info h3 {

            font-family: 'Playfair Display', serif;

            font-size: 22px;

            color: #ffffff;

            margin-bottom: 12px;

            transform: translateZ(25px);

            transition: 0.3s;
        }

        .product-card:hover .product-info h3 {
            color: #c0a16b;
        }

        .product-info p {

            font-size: 14px;

            color: #cbd5e1;

            line-height: 1.7;

            margin-bottom: 20px;

            transform: translateZ(18px);
        }


        /* ==============================
           WHATSAPP INQUIRE BUTTON
        ============================== */

        .inquire-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            width: fit-content;

            margin-top: auto;

            background: rgba(192,161,107,0.03);

            border: 1px solid #c0a16b;

            color: #c0a16b;

            padding: 11px 18px;

            font-weight: 600;

            font-size: 12px;

            text-decoration: none;

            border-radius: 6px;

            letter-spacing: 0.8px;

            transition: all 0.35s ease;

            transform: translateZ(30px);
        }

        .inquire-btn::before {

            content: "\f232";

            font-family: "Font Awesome 6 Brands";

            font-size: 15px;
        }

        .inquire-btn:hover {

            background: #c0a16b;

            color: #050f1a;

            transform:
                translateZ(45px)
                translateY(-5px)
                scale(1.04);

            box-shadow:
                0 12px 25px rgba(192,161,107,0.25);
        }


        /* ==============================
           FOOTER
        ============================== */

        footer {

            background: #030a12;

            border-top:
                1px solid rgba(192,161,107,0.2);

            padding: 55px 20px;

            text-align: center;

            margin-top: 90px;
        }

        .footer-content {

            max-width: 900px;

            margin: auto;

            line-height: 1.8;
        }

        .copyright {

            color: #ffffff;

            font-weight: 600;

            margin-bottom: 15px;

            font-size: 14px;

            letter-spacing: 0.5px;
        }

        .company-details {

            color: #c0a16b;

            font-size: 12px;

            letter-spacing: 1px;

            line-height: 2;
        }


        /* ==============================
           FLOATING WHATSAPP
        ============================== */

        .whatsapp-float {

            position: fixed;

            bottom: 25px;
            right: 25px;

            width: 62px;
            height: 62px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #25d366;

            color: #ffffff;

            border-radius: 50%;

            font-size: 30px;

            text-decoration: none;

            z-index: 2000;

            box-shadow:
                0 5px 25px rgba(37,211,102,0.35);

            animation:
                whatsappFloat 2.5s ease-in-out infinite;

            transition: 0.3s ease;
        }

        @keyframes whatsappFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .whatsapp-float:hover {

            animation-play-state: paused;

            transform:
                scale(1.12)
                rotate(8deg);

            box-shadow:
                0 8px 35px rgba(37,211,102,0.55);
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 950px) {

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }


        @media (max-width: 768px) {

            header {
                padding: 16px 20px;
            }

            #menu-toggle {
                display: block;
            }

            .nav-menu {

                display: none;

                position: absolute;

                top: 68px;
                left: 0;

                width: 100%;

                flex-direction: column;

                gap: 22px;

                padding: 25px;

                background:
                    rgba(5,15,26,0.97);

                border-bottom:
                    2px solid #c0a16b;

                backdrop-filter: blur(15px);
            }

            .nav-menu.active {
                display: flex;
            }

            .nav-menu a {
                justify-content: center;
            }

            .page-banner {
                padding: 70px 20px;
            }

            .page-banner p {
                font-size: 12px;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }

            .product-card {
                min-height: 450px;
            }

            .whatsapp-float {
                width: 58px;
                height: 58px;

                right: 18px;
                bottom: 18px;
            }
        }


        /* ==============================
           SMALL MOBILE
        ============================== */

        @media (max-width: 420px) {

            .logo {
                font-size: 18px;
            }

            .product-img {
                height: 200px;
            }

            .product-info {
                padding: 22px;
            }

            .product-info h3 {
                font-size: 20px;
            }

            .product-info p {
                font-size: 13px;
            }

            .inquire-btn {
                font-size: 11px;
                padding: 10px 14px;
            }
        }

    </style>
</head>
