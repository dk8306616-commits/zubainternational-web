<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zuba International | Contact Us</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Montserrat',sans-serif;
  background:
  radial-gradient(circle at 20% 20%,rgba(192,161,107,.08),transparent 30%),
  radial-gradient(circle at 80% 60%,rgba(0,90,180,.12),transparent 35%),
  #050f1a;
  color:#fff;
  overflow-x:hidden;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(5,15,26,.92);
  padding:18px 30px;
  border-bottom:1px solid rgba(192,161,107,.65);
  backdrop-filter:blur(15px);
  box-shadow:0 10px 40px rgba(0,0,0,.25);
}

.nav-container{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:#fff;
  text-decoration:none;
  font-size:22px;
  font-weight:700;
  letter-spacing:1px;
}

.logo span{
  color:#c0a16b;
}

.nav-menu{
  display:flex;
  align-items:center;
  gap:28px;
  list-style:none;
}

.nav-menu a{
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:600;
  letter-spacing:1px;
  display:flex;
  align-items:center;
  gap:8px;
  transition:.35s;
}

.nav-menu a i{
  color:#c0a16b;
}

.nav-menu a:hover{
  color:#c0a16b;
  transform:translateY(-3px);
}

.nav-menu a.active{
  color:#c0a16b;
}

#menu-toggle{
  display:none;
  color:#c0a16b;
  font-size:25px;
  cursor:pointer;
}

/* =========================
   PAGE BANNER
========================= */

.page-banner{
  padding:90px 20px 80px;
  text-align:center;
  background:
  linear-gradient(
    135deg,
    rgba(5,15,26,.97),
    rgba(7,22,40,.90)
  );
  border-bottom:1px solid rgba(192,161,107,.2);
}

.page-banner h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(36px,5vw,58px);
  color:#c0a16b;
  margin-bottom:16px;
  text-shadow:0 0 25px rgba(192,161,107,.25);
}

.page-banner p{
  color:#94a3b8;
  font-size:14px;
  letter-spacing:2px;
  line-height:1.7;
}

.banner-line{
  width:80px;
  height:2px;
  background:#c0a16b;
  margin:25px auto 0;
}

/* =========================
   CONTACT SECTION
========================= */

.contact-section{
  max-width:1200px;
  margin:70px auto;
  padding:0 20px;
}

.contact-grid{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:35px;
}

/* =========================
   CONTACT INFO
========================= */

.contact-info{
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.045),
    rgba(255,255,255,.015)
  );
  border:1px solid rgba(192,161,107,.25);
  border-radius:14px;
  padding:38px;
  box-shadow:0 15px 50px rgba(0,0,0,.22);
}

.contact-info h2{
  font-family:'Playfair Display',serif;
  color:#c0a16b;
  font-size:32px;
  margin-bottom:15px;
}

.contact-info > p{
  color:#aeb9c8;
  line-height:1.8;
  font-size:14px;
  margin-bottom:30px;
}

.info-item{
  display:flex;
  align-items:flex-start;
  gap:18px;
  padding:20px 0;
  border-bottom:1px solid rgba(192,161,107,.12);
}

.info-item:last-child{
  border-bottom:none;
}

.info-icon{
  min-width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(192,161,107,.5);
  border-radius:10px;
  color:#c0a16b;
  font-size:20px;
  background:rgba(192,161,107,.05);
}

.info-content h3{
  font-size:14px;
  margin-bottom:7px;
  color:#fff;
  letter-spacing:.5px;
}

.info-content a,
.info-content p{
  color:#94a3b8;
  text-decoration:none;
  font-size:13px;
  line-height:1.7;
}

.info-content a:hover{
  color:#c0a16b;
}

/* =========================
   WHATSAPP BOX
========================= */

.whatsapp-box{
  margin-top:30px;
  padding:22px;
  border:1px solid rgba(37,211,102,.35);
  background:rgba(37,211,102,.05);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.whatsapp-box-text h3{
  font-size:15px;
  margin-bottom:6px;
}

.whatsapp-box-text p{
  color:#94a3b8;
  font-size:12px;
}

.whatsapp-btn{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:12px 18px;
  border-radius:7px;
  background:#25d366;
  color:#fff;
  text-decoration:none;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  transition:.3s;
}

.whatsapp-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 25px rgba(37,211,102,.25);
}

/* =========================
   CONTACT FORM
========================= */

.contact-form{
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.045),
    rgba(255,255,255,.015)
  );
  border:1px solid rgba(192,161,107,.25);
  border-radius:14px;
  padding:38px;
  box-shadow:0 15px 50px rgba(0,0,0,.22);
}

.contact-form h2{
  font-family:'Playfair Display',serif;
  color:#c0a16b;
  font-size:32px;
  margin-bottom:10px;
}

.form-intro{
  color:#94a3b8;
  font-size:13px;
  line-height:1.7;
  margin-bottom:28px;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.form-group{
  margin-bottom:20px;
}

.form-group label{
  display:block;
  color:#d8dee7;
  font-size:12px;
  font-weight:600;
  margin-bottom:8px;
  letter-spacing:.4px;
}

.form-group label span{
  color:#c0a16b;
}

.form-control{
  width:100%;
  padding:14px 15px;
  border-radius:7px;
  border:1px solid rgba(192,161,107,.25);
  outline:none;
  background:rgba(0,0,0,.22);
  color:#fff;
  font-family:'Montserrat',sans-serif;
  font-size:13px;
  transition:.3s;
}

.form-control::placeholder{
  color:#657386;
}

.form-control:focus{
