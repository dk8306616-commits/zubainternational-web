<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Zuba International</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; font-family: 'Montserrat', sans-serif; background: #050f1a; color: #ffffff; overflow-x: hidden; }
        
        header { background: rgba(5, 15, 26, 0.92); padding: 18px 30px; border-bottom: 2px solid #c0a16b; position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        
        .logo { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 20px; color: white; text-decoration: none; letter-spacing: 1px; white-space: uppercase; }
        .logo span { color: #c0a16b; }
        
        #menu-toggle { display: none; color: #c0a16b; font-size: 22px; cursor: pointer; }
        .nav-menu { display: flex; gap: 20px; list-style: none; align-items: center; }
        .nav-menu a { color: #fff; text-decoration: none; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: 0.3s; white-space: nowrap; }
        .nav-menu a i { color: #c0a16b; }
        .nav-menu a:hover { color: #c0a16b; }

        .page-header { text-align: center; padding: 50px 20px 20px; }
        .page-header h1 { font-family: 'Playfair Display', serif; color: #c0a16b; font-size: 36px; margin-bottom: 10px; }
        .page-header p { color: #94a3b8; font-size: 14px; }

        .container { width: 92%; max-width: 750px; margin: 20px auto 50px; background: #071628; border: 2px solid #c0a16b; border-radius: 12px; padding: 35px 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); }
        
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px 15px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(192, 161, 107, 0.3); border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
        .form-control:focus { border-color: #c0a16b; background: rgba(255, 255, 255, 0.08); }

        .submit-btn { width: 100%; background: #c0a16b; color: #050f1a; padding: 14px; font-weight: 700; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 15px; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .submit-btn:hover { background: #d4b277; transform: translateY(-2px); }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            #menu-toggle { display: block; }
            .logo { font-size: 15px; }
            .nav-menu { display: none; flex-direction: column; position: absolute; top: 65px; left: 0; width: 100%; background: #050f1a; padding: 20px 0; border-bottom: 2px solid #c0a16b; text-align: center; }
            .nav-menu.active { display: flex; }
            .container { width: 95%; padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Zuba <span>International</span></a>
            <div id="menu-toggle"><i class="fa-solid fa-bars"></i></div>
            <nav class="nav-menu" id="nav-menu">
                <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
                <a href="products.html"><i class="fa-solid fa-box-open"></i> Products</a>
                <a href="about.html"><i class="fa-solid fa-circle-info"></i> About</a>
                <a href="contact.html" style="color: #c0a16b;"><i class="fa-solid fa-envelope"></i> Contact</a>
                <a href="coffee.html"><i class="fa-solid fa-mug-hot"></i> Coffee with us!</a>
            </nav>
        </div>
    </header>

    <div class="page-header">
        <h1>Get In Touch</h1>
        <p>Connect with our B2B trade & support experts</p>
    </div>

    <div class="container">
        <form id="contactForm">
            <div class="form-group">
                <label>Enter Name / Company Name *</label>
                <input type="text" class="form-control" id="conName" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Enter Email Address *</label>
                <input type="email" class="form-control" id="conEmail" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Inquiry Subject *</label>
                <input type="text" class="form-control" id="conSub" required placeholder="e.g. Export Quotation, Bulk Order">
            </div>
            <div class="form-group">
                <label>Enter Message *</label>
                <textarea class="form-control" id="conMsg" rows="4" required placeholder="Write your message here..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message via WhatsApp</button>
        </form>
    </div>

    <script>
        document.getElementById('menu-toggle').onclick = function() {
            document.getElementById('nav-menu').classList.toggle('active');
        };

        document.getElementById('contactForm').onsubmit = function(e) {
            e.preventDefault();
            const name = document.getElementById('conName').value.trim();
            const email = document.getElementById('conEmail').value.trim();
            const sub = document.getElementById('conSub').value.trim();
            const msg = document.getElementById('conMsg').value.trim();

            let text = `*Contact Us Enquiry - Zuba International*\n\n` +
                       `*Name:* ${name}\n*Email:* ${email}\n*Subject:* ${sub}\n*Message:* ${msg}`;

            window.open(`https://wa.me/919278246138?text=${encodeURIComponent(text)}`, '_blank');
        };
    </script>
</body>
</html>
