<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuba International | Global Import & Export</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Yahan se overflow: hidden hata diya gaya hai */
        body, html { 
            margin: 0; 
            padding: 0; 
            min-height: 100vh; 
            font-family: 'Montserrat', sans-serif; 
        }
        
        /* Video Background */
        #bg-video { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            z-index: -1; 
        }
        
        /* Navbar */
        header { 
            background: rgba(10, 37, 64, 0.9); 
            padding: 20px 25px; 
            color: white; 
            border-bottom: 3px solid #c0a16b; 
            position: relative; 
            z-index: 10; 
        }
        .nav-container { 
            max-width: 1200px; 
            margin: 0 auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .logo { 
            font-weight: 800; 
            font-size: 22px; 
            letter-spacing: 2px; 
            color: white; 
            text-decoration: none; 
        }
        .logo span { color: #c0a16b; }
        
        .nav-menu { 
            display: flex; 
            gap: 25px; 
            list-style: none; 
            margin: 0; 
            padding: 0; 
        }
        .nav-menu a { 
            color: white; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 14px; 
            transition: color 0.3s; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .nav-menu a i { color: #c0a16b; font-size: 16px; }
        .nav-menu a:hover { color: #c0a16b; }

        /* WhatsApp Button */
        .whatsapp-float { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            background-color: #25d366; 
            color: white; 
            border-radius: 50px; 
            text-align: center; 
            font-size: 32px; 
            width: 60px; 
            height: 60px; 
            line-height: 60px; 
            box-shadow: 2px 2px 15px rgba(0,0,0,0.3); 
            z-index: 1000; 
            transition: transform 0.3s; 
            text-decoration: none; 
        }
        .whatsapp-float:hover { transform: scale(1.1); }
    </style>
</head>
<body>

    <!-- Background Video -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="wap.mp4" type="video/mp4">
    </video>

    <!-- Header / Navbar -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">ZUBA <span>INTERNATIONAL</span></a>
            <nav class="nav-menu">
                <a href="index.html"><i class="fa-solid fa-house"></i> HOME</a>
                <a href="products.html"><i class="fa-solid fa-box-open"></i> PRODUCTS</a>
                <a href="about.html"><i class="fa-solid fa-circle-info"></i> ABOUT</a>
                <a href="contact.html"><i class="fa-solid fa-envelope"></i> CONTACT</a>
            </nav>
        </div>
    </header>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/919278246138" class="whatsapp-float" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

</body>
</html>
