<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport Meta Tag: Ye mobile responsivity ke liye sabse zaruri hai -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuba International | Global Import & Export</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; width: 100%; min-height: 100vh; 
            font-family: 'Montserrat', sans-serif; overflow-x: hidden;
        }
        
        #bg-video { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: -1; 
        }
        
        header { 
            background: rgba(10, 37, 64, 0.9); padding: 15px 10px; 
            border-bottom: 3px solid #c0a16b; width: 100%;
        }
        .nav-container { 
            max-width: 1200px; margin: 0 auto; display: flex; 
            justify-content: space-between; align-items: center; flex-wrap: wrap; 
        }
        .logo { font-weight: 800; font-size: 18px; color: white; text-decoration: none; }
        .logo span { color: #c0a16b; }
        
        .nav-menu { 
            display: flex; gap: 15px; list-style: none; margin: 0; padding: 0; 
        }
        .nav-menu a { 
            color: white; text-decoration: none; font-size: 12px; font-weight: 600; 
            display: flex; align-items: center; gap: 5px;
        }
        .nav-menu a i { color: #c0a16b; }

        /* WhatsApp Button */
        .whatsapp-float { 
            position: fixed; bottom: 20px; right: 20px; background-color: #25d366; 
            color: white; border-radius: 50%; font-size: 24px; width: 50px; 
            height: 50px; line-height: 50px; text-align: center; z-index: 1000; 
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .nav-menu { gap: 10px; font-size: 10px; }
            .nav-menu a { font-size: 10px; }
            .logo { font-size: 14px; }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="wap.mp4" type="video/mp4">
    </video>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">ZUBA <span>INTERNATIONAL</span></a>
            <nav class="nav-menu">
                <a href="index.html"><i class="fa-solid fa-house"></i> HOME</a>
                <a href="products.html"><i class="fa-solid fa-box-open"></i> PROD</a>
                <a href="about.html"><i class="fa-solid fa-circle-info"></i> ABOUT</a>
                <a href="contact.html"><i class="fa-solid fa-envelope"></i> CONTACT</a>
            </nav>
        </div>
    </header>

    <a href="https://wa.me/919278246138" class="whatsapp-float" target="_blank">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

</body>
</html>
