<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuba International - Premium Home Decor</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Open+Sans:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Mobile Menu Styles */
        .why-choose { background-color: #fcfbf9; padding: 80px 20px; text-align: center; }
        .why-choose h2 { font-family: 'Playfair Display', serif; font-size: 40px; color: #0a2540; margin-bottom: 20px; }
        .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; max-width: 1100px; margin: 0 auto; }
        .feature-card { background: white; padding: 40px 25px; border-radius: 8px; border-top: 4px solid #c0a16b; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
    </style>
</head>
<body style="margin: 0; font-family: 'Montserrat', sans-serif;">

    <!-- Navigation Bar -->
    <header style="background: #0a2540; padding: 15px 20px; color: white; border-bottom: 3px solid #c0a16b; position: relative;">
        <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
            <div style="font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 2px;">
                ZUBA <span style="color: #c0a16b;">INTL</span>
            </div>
            <!-- Hamburger Icon -->
            <div id="menu-btn" style="cursor: pointer; font-size: 24px; color: #c0a16b;">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>

        <!-- Dropdown Menu -->
        <nav id="navbar" style="display: none; position: absolute; top: 100%; left: 0; width: 100%; background: #0a2540; padding: 20px 0; border-bottom: 3px solid #c0a16b; z-index: 100;">
            <ul style="list-style: none; padding: 0; margin: 0; text-align: center;">
                <li style="margin: 20px 0;"><a href="index.html" style="color: white; text-decoration: none; font-size: 16px;"><i class="fa-solid fa-house" style="margin-right: 10px; color: #c0a16b;"></i> Home</a></li>
                <li style="margin: 20px 0;"><a href="products.html" style="color: white; text-decoration: none; font-size: 16px;"><i class="fa-solid fa-box-open" style="margin-right: 10px; color: #c0a16b;"></i> Products</a></li>
                <li style="margin: 20px 0;"><a href="about.html" style="color: white; text-decoration: none; font-size: 16px;"><i class="fa-solid fa-circle-info" style="margin-right: 10px; color: #c0a16b;"></i> About Us</a></li>
                <li style="margin: 20px 0;"><a href="contact.html" style="color: white; text-decoration: none; font-size: 16px;"><i class="fa-solid fa-envelope" style="margin-right: 10px; color: #c0a16b;"></i> Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section style="position: relative; height: 80vh; display: flex; align-items: center; justify-content: center; text-align: center;">
        <video autoplay loop muted playsinline style="position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; width: auto; height: auto; z-index: -1; transform: translate(-50%, -50%); opacity: 0.85;">
            <source src="https://www.w3schools.com/howto/rain.mp4" type="video/mp4">
        </video>
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 37, 64, 0.65); z-index: 0;"></div>
        <div style="position: relative; z-index: 1; color: white; padding: 0 20px;">
            <h1 style="font-family: 'Playfair Display', serif; font-size: 45px; margin-bottom: 20px;">Elevating Spaces Globally</h1>
            <a href="products.html" style="background: #c0a16b; color: white; padding: 15px 35px; text-decoration: none; font-weight: 600; border-radius: 4px; display: inline-block;">Explore Catalog</a>
        </div>
    </section>

    <!-- Script -->
    <script>
        const menuBtn = document.getElementById('menu-btn');
        const navbar = document.getElementById('navbar');
        menuBtn.addEventListener('click', () => {
            navbar.style.display = (navbar.style.display === 'block') ? 'none' : 'block';
        });
    </script>
</body>
</html>
