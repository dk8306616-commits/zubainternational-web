<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee with us! | Zuba International</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; font-family: 'Montserrat', sans-serif; background: #e11d48; color: #ffffff; overflow-x: hidden; }
        
        header { background: #be123c; padding: 15px 20px; border-bottom: 2px solid rgba(255,255,255,0.2); position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        
        /* Luxury Font Styling for Logo */
        .logo { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 19px; color: white; text-decoration: none; letter-spacing: 1.5px; white-space: nowrap; text-transform: uppercase; }
        .logo span { color: #fde047; font-style: italic; font-weight: 600; }
        
        #menu-toggle { display: none; color: #fff; font-size: 22px; cursor: pointer; }
        .nav-menu { display: flex; gap: 20px; list-style: none; align-items: center; }
        .nav-menu a { color: #fff; text-decoration: none; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: 0.3s; white-space: nowrap; }
        .nav-menu a i { color: #fde047; }
        .nav-menu a:hover { color: #fde047; }

        .container { width: 92%; max-width: 550px; margin: 30px auto; background: #f43f5e; border: 2px solid #fb7185; border-radius: 12px; padding: 25px 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); text-align: center; }
        
        /* Iced Cup Animation */
        .iced-cup-container { width: 80px; height: 100px; margin: 0 auto 15px; position: relative; animation: cupBounce 2s ease-in-out infinite; }
        .straw { position: absolute; top: -12px; left: 48px; width: 5px; height: 40px; background: #1e293b; transform: rotate(15deg); border-radius: 3px; z-index: 3; }
        .dome-lid { position: absolute; top: 12px; left: 12px; width: 56px; height: 22px; background: rgba(255, 255, 255, 0.9); border-radius: 25px 25px 5px 5px; z-index: 2; border-bottom: 2px solid #cbd5e1; }
        .cup-body { position: absolute; top: 32px; left: 15px; width: 50px; height: 60px; background: linear-gradient(135deg, #d97706 0%, #b45309 100%); border-radius: 0 0 10px 10px; z-index: 1; display: flex; justify-content: center; align-items: center; border: 2px solid rgba(255,255,255,0.3); }
        .cup-logo { font-size: 13px; font-weight: 800; color: #facc15; background: #b91c1c; width: 20px; height: 20px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }

        @keyframes cupBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        h1 { font-family: 'Playfair Display', serif; color: #fff; font-size: 24px; margin-bottom: 6px; }
        p.subtitle { color: #ffe4e6; font-size: 12px; margin-bottom: 20px; }

        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .form-control { width: 100%; padding: 11px 14px; background: #be123c; border: 1px solid #fb7185; border-radius: 6px; color: #fff; font-size: 13px; outline: none; }
        .form-control::placeholder { color: #fecdd3; }
        
        .checkbox-grid { display: grid; grid-template-columns: 1fr; gap: 8px; background: #be123c; padding: 12px; border-radius: 6px; border: 1px solid #fb7185; max-height: 140px; overflow-y: auto; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #fff; }
        .checkbox-item input { accent-color: #fde047; width: 14px; height: 14px; }

        .submit-btn { width: 100%; background: #ffffff; color: #e11d48; padding: 13px; font-weight: 700; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .submit-btn:hover { background: #f1f5f9; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            #menu-toggle { display: block; }
            .logo { font-size: 14px; letter-spacing: 1px; }
            .nav-menu { display: none; flex-direction: column; position: absolute; top: 60px; left: 0; width: 100%; background: #be123c; padding: 20px 0; border-bottom: 2px solid rgba(255,255,255,0.2); text-align: center; }
            .nav-menu.active { display: flex; }
            .container { width: 95%; padding: 20px 15px; margin: 15px auto; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Zuba <span>International</span></a>
            <div id="menu-toggle"><i class="fa-solid fa-bars"></i></div>
            <nav class="nav-menu" id="nav-menu">
                <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
                <a href="products.html"><i class="fa-solid fa-box-open"></i> Products</a>
                <a href="about.html"><i class="fa-solid fa-circle-info"></i> About</a>
                <a href="contact.html"><i class="fa-solid fa-envelope"></i> Contact</a>
                <a href="coffee.html" style="color: #fde047;"><i class="fa-solid fa-mug-hot"></i> Coffee with us!</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="iced-cup-container">
            <div class="straw"></div>
            <div class="dome-lid"></div>
            <div class="cup-body">
                <div class="cup-logo">M</div>
            </div>
        </div>

        <h1>Coffee with us!</h1>
        <p class="subtitle">Let's discuss your luxury project over a virtual coffee.</p>
        
        <form id="coffeeForm">
            <div class="form-group">
                <label>Enter Name *</label>
                <input type="text" class="form-control" id="cName" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Enter Email *</label>
                <input type="email" class="form-control" id="cEmail" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Company Name *</label>
                <input type="text" class="form-control" id="cCompany" required placeholder="Enter company name">
            </div>
            <div class="form-group">
                <label>Enter Phone *</label>
                <input type="tel" class="form-control" id="cPhone" required placeholder="Enter phone number">
            </div>
            
            <div class="form-group">
                <label>Services *</label>
                <div class="checkbox-grid">
                    <label class="checkbox-item"><input type="checkbox" name="cprod" value="Architectural Wall Panels"> Architectural Wall Panels</label>
                    <label class="checkbox-item"><input type="checkbox" name="cprod" value="WPC Wall Panels"> WPC Wall Panels</label>
                    <label class="checkbox-item"><input type="checkbox" name="cprod" value="Carbon Crystal Panels"> Carbon Crystal Panels</label>
                    <label class="checkbox-item"><input type="checkbox" name="cprod" value="UV Marble Sheets"> UV Marble Sheets</label>
                    <label class="checkbox-item"><input type="checkbox" name="cprod" value="PVC Wall Panels"> PVC Wall Panels</label>
                    <label class="checkbox-item"><input type="checkbox" name="cprod" value="Charcoal Fluted Panels"> Charcoal Fluted Panels</label>
                    <label class="checkbox-item"><input type="checkbox" name="cprod" value="Decorative Lights"> Decorative Lights</label>
                    <label class="checkbox-item"><input type="checkbox" name="cprod" value="Other Products"> Other Products</label>
                </div>
            </div>

            <div class="form-group">
                <label>Enter Message</label>
                <textarea class="form-control" id="cMessage" rows="2" placeholder="Tell us about your requirements..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

    <script>
        document.getElementById('menu-toggle').onclick = function() {
            document.getElementById('nav-menu').classList.toggle('active');
        };

        document.getElementById('coffeeForm').onsubmit = function(e) {
            e.preventDefault();
            const name = document.getElementById('cName').value.trim();
            const email = document.getElementById('cEmail').value.trim();
            const company = document.getElementById('cCompany').value.trim();
            const phone = document.getElementById('cPhone').value.trim();
            const message = document.getElementById('cMessage').value.trim();

            let prods = [];
            document.querySelectorAll('input[name="cprod"]:checked').forEach((cb) => { prods.push(cb.value); });

            let text = `*Coffee with us! Enquiry - Zuba International*\n\n` +
                       `*Name:* ${name}\n*Phone:* ${phone}\n*Email:* ${email || 'N/A'}\n` +
                       `*Company:* ${company || 'N/A'}\n*Services:* ${prods.length > 0 ? prods.join(', ') : 'General'}\n*Message:* ${message || 'N/A'}`;

            window.open(`https://wa.me/919278246138?text=${encodeURIComponent(text)}`, '_blank');
        };
    </script>
</body>
</html>
